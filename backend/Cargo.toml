[package]
name = "clock-trainer-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "=0.7.9"
tokio = { version = "=1.38.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
rusqlite = { version = "=0.31.0", features = ["bundled"] }
argon2 = "=0.5.3"
rand = "=0.8.5"
# Keep the password-hash dependency tree compatible with Cargo 1.75.
base64ct = "=1.6.0"
hyper-util = "=0.1.10"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
